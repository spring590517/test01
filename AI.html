<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>職缺性格需求分析 — HR 工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  /* ── 104人力銀行 色系 ── */
  --bg:        #F0F2F5;
  --surface:   #FFFFFF;
  --surface2:  #F6F8FA;
  --border:    #DDE2E8;
  --ink:       #2C3340;
  --ink2:      #5A6478;
  --ink3:      #9AA5B8;
  --accent:    #00B2B2;
  --accent-bg: #E6F7F7;
  --gold:      #F06023;
  --gold-bg:   #FEF0E8;
  --green:     #008F8F;
  --green-bg:  #E0F4F4;
  --blue:      #1A6DB5;
  --blue-bg:   #EBF4FC;
  --r: 6px;
  --r-lg: 10px;
  --shadow: 0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }



#appShell { max-width: 900px; margin: 0 auto; padding: 32px 20px 48px; }
.hero { text-align: center; margin-bottom: 40px; padding: 40px 20px 32px; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent);
  background: var(--accent-bg); border: 1px solid #80D9D9;
  padding: 4px 14px; border-radius: 20px; margin-bottom: 16px;
}
.hero-title {
  font-family: 'DM Sans', 'Noto Sans TC', sans-serif; font-size: 28px; font-weight: 700;
  color: var(--ink); line-height: 1.3; margin-bottom: 10px;
}
.hero-desc { font-size: 14px; color: var(--ink2); max-width: 500px; margin: 0 auto; line-height: 1.7; }
.steps-row {
  display: flex; align-items: center; justify-content: center;
  gap: 0; margin-bottom: 28px;
}
.step-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink3); font-weight: 500; }
.step-item.active { color: var(--ink); }
.step-item.done { color: var(--green); }
.step-num {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; background: var(--surface);
  flex-shrink: 0; transition: all 0.2s;
}
.step-item.active .step-num { background: var(--accent); border-color: var(--accent); color: white; }
.step-item.done .step-num   { background: var(--green); border-color: var(--green); color: white; }
.step-arrow { width: 32px; height: 1px; background: var(--border); margin: 0 4px; }
.input-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;
}
@media (max-width: 540px) { .input-grid { grid-template-columns: 1fr; } }
.input-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r-lg); overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-card:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,178,178,0.12);
}
.input-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.input-label { display: flex; align-items: center; gap: 8px; }
.step-pill {
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em;
  padding: 2px 8px; border-radius: 3px; background: var(--accent); color: white;
}
.input-title { font-size: 13px; font-weight: 600; color: var(--ink); }
.input-hint { font-size: 11px; color: var(--ink3); }
textarea {
  width: 100%; border: none; outline: none; background: var(--surface);
  padding: 14px 16px; font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
  font-size: 13px; line-height: 1.7; color: var(--ink); resize: vertical; min-height: 200px;
}
textarea::placeholder { color: var(--ink3); }
.input-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-top: 1px solid var(--border); background: var(--surface2);
}
.sample-btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; color: var(--ink2);
  background: transparent; border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 12px; cursor: pointer; transition: all 0.15s;
}
.sample-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
.input-status { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink3); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
.status-dot.filled { background: var(--green); }
.analyze-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0 0; }
.btn-analyze {
  position: relative; background: var(--accent); color: white; border: none;
  border-radius: var(--r); padding: 11px 28px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
  letter-spacing: 0.03em; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 8px; overflow: hidden;
}
.btn-analyze::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.06));
}
.btn-analyze:hover:not(:disabled) { background: #008F8F; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,178,178,0.3); }
.btn-analyze:disabled { background: var(--ink3); cursor: not-allowed; transform: none; }
.btn-demo {
  background: var(--surface); color: var(--ink2);
  border: 1.5px solid var(--border); border-radius: var(--r);
  padding: 11px 20px; font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 7px;
}
.btn-demo:hover { background: var(--gold-bg); border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }
.analyze-note { font-size: 11px; color: var(--ink3); display: flex; align-items: center; gap: 5px; }
.loading-wrap { display: none; flex-direction: column; align-items: center; gap: 14px; padding: 32px; text-align: center; }
.loading-wrap.active { display: flex; }
.loading-bar-outer { width: 280px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.loading-bar-inner {
  height: 100%; background: var(--accent); border-radius: 2px; width: 0%;
  animation: loadprogress 40s ease-out forwards;
}
@keyframes loadprogress {
  0%{width:0%} 20%{width:25%} 50%{width:55%} 80%{width:80%} 95%{width:90%}
}
.loading-label { font-size: 13px; font-weight: 500; color: var(--ink2); }
.loading-sub { font-size: 11px; color: var(--ink3); }
.loading-dots span { display: inline-block; animation: blink 1.4s infinite both; }
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--ink); color: white; padding: 10px 20px;
  border-radius: 8px; font-size: 13px; font-weight: 500;
  z-index: 300; transition: transform 0.3s ease; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
#jobTraitsPanel { max-width: 960px; margin: 0 auto; padding: 0 20px 60px; }
.btn-reset {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; padding: 8px 18px;
  border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink2);
  cursor: pointer; transition: all 0.15s; margin: 0 auto 32px;
}
.btn-reset:hover { background: var(--bg); border-color: var(--ink); color: var(--ink); }
.btn-export {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent); color: white; border: 1.5px solid var(--accent);
  border-radius: var(--r); padding: 8px 18px;
  font-family: 'DM Sans','Noto Sans TC',sans-serif;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; letter-spacing: 0.01em;
}
.btn-export:hover { background: #008F8F; border-color: #008F8F; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,143,143,.25); }
.btn-export:disabled { background: var(--ink3); border-color: var(--ink3); cursor: not-allowed; transform: none; box-shadow: none; }

/* Part tabs */
.part-tabs {
  display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.part-tab {
  font-size: 12px; font-weight: 600; padding: 6px 16px;
  border-radius: 20px; border: 1.5px solid var(--border);
  background: var(--surface); color: var(--ink2);
  cursor: pointer; transition: all 0.15s;
}
.part-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
.part-tab:hover:not(.active) { border-color: var(--ink2); color: var(--ink); }
.btn-export-inline {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'DM Sans','Noto Sans TC',sans-serif;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;
  padding: 5px 12px; border-radius: 6px;
  background: var(--accent-bg); color: var(--green);
  border: 1.5px solid #66CCCC;
  cursor: pointer; transition: all 0.18s; white-space: nowrap;
}
.btn-export-inline:hover { background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-1px); }
.btn-export-inline:disabled { opacity: .45; cursor: not-allowed; transform: none; }

/* Score badge */
.score-badge-1 { background:#F0F2F5; color:#9AA5B8; border:1px solid #DDE2E8; }
.score-badge-2 { background:#FEF0E8; color:#C44D1A; border:1px solid #F9B99A; }
.score-badge-3 { background:#FFF8E8; color:#9A7010; border:1px solid #EDD888; }
.score-badge-4 { background:#E6F7F7; color:#007A7A; border:1px solid #80CCCC; }
.score-badge-5 { background:#e8f5e8; color:#1a6a1a; border:1px solid #80c080; }

/* Trait row */
.trait-row {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: box-shadow 0.15s;
}
.trait-row:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
.trait-row-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap;
}
.trait-name { font-size: 14px; font-weight: 800; color: #1a1a2e; }
.trait-typical { font-size: 11.5px; font-weight: 500; color: #8a8aa0; }
.score-chip {
  margin-left: auto; font-size: 11px; font-weight: 700;
  border-radius: 6px; padding: 2px 10px; flex-shrink: 0;
}
.trait-def { font-size: 11.5px; color: #5a5a7a; margin-bottom: 6px; line-height: 1.5; }
.trait-need-label { font-size: 11px; font-weight: 700; color: #777; letter-spacing: 0.04em; margin-bottom: 3px; }
.trait-need-text { font-size: 12px; color: #3a3a5a; line-height: 1.65; margin-bottom: 8px; }
.evidence-row { display:flex; gap:6px; align-items:flex-start; margin-top:4px; }
.evidence-icon { flex-shrink:0; margin-top:2px; }
.evidence-text { font-size:11.5px; color:#3a3a5a; line-height:1.65; font-style:italic; }

/* ── 密碼閘 ── */
#gate {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #007A7A 0%, #00B2B2 55%, #E6F7F7 140%);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
#gate.hidden { display: none; }
.gate-card {
  background: var(--surface); border-radius: var(--r-lg);
  box-shadow: 0 8px 40px rgba(0,0,0,0.22);
  width: 100%; max-width: 360px; padding: 34px 30px 28px; text-align: center;
}
.gate-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-bg); border: 1px solid #80D9D9;
  padding: 4px 14px; border-radius: 20px; margin-bottom: 18px;
}
.gate-title { font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
.gate-desc  { font-size: 12.5px; color: var(--ink2); margin-bottom: 20px; line-height: 1.6; }
.gate-input {
  width: 100%; border: 1.5px solid var(--border); border-radius: var(--r);
  padding: 11px 14px; font-size: 14px; color: var(--ink); outline: none;
  text-align: center; letter-spacing: 0.15em; transition: border-color 0.2s, box-shadow 0.2s;
}
.gate-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,178,178,0.12); }
.gate-input.err { border-color: #E5484D; animation: gate-shake 0.35s; }
@keyframes gate-shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
}
.gate-err-msg { font-size: 11.5px; color: #E5484D; min-height: 16px; margin: 8px 0 4px; }
.gate-btn {
  width: 100%; margin-top: 6px; border: none; border-radius: var(--r);
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 700;
  padding: 11px; cursor: pointer; transition: background 0.15s;
}
.gate-btn:hover { background: var(--green); }
.gate-cancel {
  width: 100%; margin-top: 8px; border: 1px solid var(--border); border-radius: var(--r);
  background: transparent; color: var(--ink2); font-size: 13px; font-weight: 600;
  padding: 9px; cursor: pointer; transition: background 0.15s, color 0.15s;
}
.gate-cancel:hover { background: var(--surface2); color: var(--ink); }
.gate-foot { font-size: 10.5px; color: var(--ink3); margin-top: 16px; }
</style>
</head>
<body>

<!-- ── 密碼閘（點分析／範例時才跳出）── -->
<div id="gate" class="hidden">
  <div class="gate-card">
    <div class="gate-badge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 11c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      HR 內部工具
    </div>
    <div class="gate-title">請輸入密碼</div>
    <div class="gate-desc">此功能僅供內部使用，輸入通行密碼後即可執行。</div>
    <input type="password" id="gateInput" class="gate-input" placeholder="請輸入密碼"
           autocomplete="off" onkeydown="if(event.key==='Enter')checkGate()">
    <div class="gate-err-msg" id="gateErr"></div>
    <button class="gate-btn" onclick="checkGate()">確認</button>
    <button class="gate-cancel" onclick="closeGate()">取消</button>
    <div class="gate-foot">104人力銀行 · 內部原型</div>
  </div>
</div>

<script>
// ── 密碼閘設定：如需更換密碼，只改這一行即可 ──
const ACCESS_PW = '104104';

let gateUnlocked = false;   // 本次工作階段是否已通過密碼
let pendingAction = null;   // 通過密碼後要執行的動作

// 分析／範例按鈕都改為呼叫此函式：未解鎖則跳密碼視窗，解鎖後直接執行
function requireGate(action) {
  if (gateUnlocked) { action(); return; }
  pendingAction = action;
  document.getElementById('gateErr').textContent = '';
  const input = document.getElementById('gateInput');
  input.value = '';
  document.getElementById('gate').classList.remove('hidden');
  setTimeout(() => input.focus(), 50);
}

function checkGate() {
  const input = document.getElementById('gateInput');
  const err   = document.getElementById('gateErr');
  if (input.value === ACCESS_PW) {
    gateUnlocked = true;
    document.getElementById('gate').classList.add('hidden');
    const act = pendingAction; pendingAction = null;
    if (act) act();
  } else {
    err.textContent = '密碼錯誤，請再試一次';
    input.classList.remove('err'); void input.offsetWidth; input.classList.add('err');
    input.select();
  }
}

function closeGate() {
  document.getElementById('gate').classList.add('hidden');
  pendingAction = null;
}

// Esc 關閉密碼視窗
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !document.getElementById('gate').classList.contains('hidden')) closeGate();
});
</script>

<div id="appShell">
  <div class="hero">
    <div class="hero-eyebrow">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      公司職缺性格解析器
    </div>
    <h1 class="hero-title">解析公司職缺需要的職業性格</h1>
    <p class="hero-desc">提供公司介紹與職缺說明，AI 即時解析公司職缺在 54 個性格向度的需求強度。</p>
  </div>

  <div class="steps-row">
    <div class="step-item active" id="step1item"><div class="step-num">1</div><span>公司介紹</span></div>
    <div class="step-arrow"></div>
    <div class="step-item" id="step2item"><div class="step-num">2</div><span>職缺說明</span></div>
    <div class="step-arrow"></div>
    <div class="step-item" id="step3item"><div class="step-num">3</div><span>性格分析</span></div>
  </div>

  <div class="input-grid">
    <div class="input-card">
      <div class="input-card-header">
        <div class="input-label">
          <span class="step-pill">STEP 1</span>
          <span class="input-title">公司介紹</span>
        </div>
        <div class="input-hint">從 104 公司頁複製</div>
      </div>
      <textarea id="companyInput" placeholder="請將公司頁資訊複製貼上到這裡…

建議包含：
· 公司名稱
· 產業類別
· 員工人數
· 公司簡介 / 品牌故事" oninput="updateStatus()"></textarea>
      <div class="input-footer">
        <button class="sample-btn" onclick="loadSample('company')">📋 帶入範例</button>
        <div class="input-status">
          <div class="status-dot" id="companyDot"></div>
          <span id="companyStatusText">尚未輸入</span>
        </div>
      </div>
    </div>

    <div class="input-card">
      <div class="input-card-header">
        <div class="input-label">
          <span class="step-pill">STEP 2</span>
          <span class="input-title">職缺說明</span>
        </div>
        <div class="input-hint">從 104 職缺頁複製</div>
      </div>
      <textarea id="jobInput" placeholder="請將職缺說明複製貼上到這裡…

建議包含：
· 職缺名稱
· 工作內容
· 應徵條件" oninput="updateStatus()"></textarea>
      <div class="input-footer">
        <button class="sample-btn" onclick="loadSample('job')">📋 帶入範例</button>
        <div class="input-status">
          <div class="status-dot" id="jobDot"></div>
          <span id="jobStatusText">尚未輸入</span>
        </div>
      </div>
    </div>
  </div>

  <div class="analyze-wrap">
    <div style="display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn-analyze" id="jobAnalyzeBtn" onclick="requireGate(analyzeJob)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        分析公司職缺性格需求

function safeParseJSON(raw) {
  // Strip markdown fences
  let s = raw.replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```\s*$/,'').trim();
  // Try direct parse
  try { return JSON.parse(s); } catch(e) {}
  // Find outermost { }
  const start = s.indexOf('{');
  if (start === -1) return null;
  // Find matching closing brace
  let depth = 0, end = -1;
  for (let i = start; i < s.length; i++) {
    if (s[i] === '{') depth++;
    else if (s[i] === '}') { depth--; if (depth === 0) { end = i; break; } }
  }
  const candidate = end !== -1 ? s.slice(start, end + 1) : s.slice(start);
  try { return JSON.parse(candidate); } catch(e) {}
  // Last resort: try to fix truncated JSON by closing open structures
  try {
    let fixed = candidate;
    // Count unclosed brackets
    let opens = (fixed.match(/\[/g)||[]).length - (fixed.match(/\]/g)||[]).length;
    let braces = (fixed.match(/\{/g)||[]).length - (fixed.match(/\}/g)||[]).length;
    // Remove trailing incomplete entry
    const lastComma = fixed.lastIndexOf(',');
    const lastBrace = Math.max(fixed.lastIndexOf('}'), fixed.lastIndexOf(']'));
    if (lastComma > lastBrace) fixed = fixed.slice(0, lastComma);
    for (let i = 0; i < opens; i++) fixed += ']';
    for (let i = 0; i < braces; i++) fixed += '}';
    const parsed = JSON.parse(fixed);
    console.warn('Recovered truncated JSON, traits count:', parsed.traits ? parsed.traits.length : 'unknown');
    return parsed;
  } catch(e2) {}
  return null;
}

// 單次呼叫：一次請模型同時對「公司頁」與「職缺頁」各給 54 個向度評分，
// 龐大的評分錨點與向度清單只需送出一次，節省 token 並減少一次往返。
function buildPrompt(companyText, jobText) {
  return `你是一位資深人資顧問，專精大五人格評估。請針對【公司介紹】與【職缺說明】兩份文本，各自針對全部 54 個性格向度逐一評分（共兩組、每組 54 個）。

【評分規則】
分數代表「此文本對該特質的需求程度」，依據文字訊號嚴格對照下方各向度錨點給分：
1=完全不需要 2=不太需要 3=部分需要 4=需要 5=非常需要

評分步驟：
1. 先閱讀向度定義與典型描述，理解該向度的核心意涵
2. 再對照該向度的評分錨點，找出最符合文字訊號的等級
3. 反向向度（L結尾）同樣正向評估其對該文本的需求程度
4. 「公司評分」僅依公司介紹判斷；「職缺評分」以職缺說明為主、公司介紹為輔

【各向度定義與評分錨點】
${SCORING_CRITERIA_STR}

【性格向度清單含定義與典型描述（公司、職缺各須對全部54個評分）】
${TRAIT_LIST_STR}

請以 JSON 格式回應（注意：def限15字、reason限20字、ev限15字，嚴格精簡以避免截斷）：
{
  "jobTitle": "職位名稱",
  "companyName": "公司名稱",
  "company": [
    {
      "traitCode": "D14H",
      "trait": "向度名稱",
      "factor": "所屬因素",
      "def": "向度定義（15字內）",
      "score": 1到5的整數,
      "reason": "給分理由（20字內）",
      "ev": "公司介紹原文佐證（15字內，無則留空字串）"
    }
  ],
  "job": [
    {
      "traitCode": "D14H",
      "trait": "向度名稱",
      "factor": "所屬因素",
      "def": "向度定義（15字內）",
      "score": 1到5的整數,
      "reason": "給分理由（20字內）",
      "ev": "職缺說明原文佐證（15字內，無則留空字串）"
    }
  ]
}

規則：
- company 與 job 都必須各含全部 54 個向度，不得遺漏，按向度清單順序排列
- 每個分數必須先理解向度定義，再嚴格對照錨點描述，不可憑空判斷
- 分數須有差異，不應全部相同
- 只回傳 JSON，不加任何其他文字或 markdown

以下是【公司介紹】的內容：
${companyText}

以下是【職缺說明】的內容：
${jobText}`;
}

// ── Main analyze ──
async function analyzeJob() {
  const company = document.getElementById('companyInput').value.trim();
  const job     = document.getElementById('jobInput').value.trim();
  if (!job) { showToast('⚠ 請先填入職缺說明（STEP 2）'); return; }

  const btn      = document.getElementById('jobAnalyzeBtn');
  const loadWrap = document.getElementById('jobLoadingWrap');
  const loadSub  = document.getElementById('loadingSubText');
  btn.disabled = true;
  loadWrap.classList.add('active');

  const bar = document.getElementById('jobLoadingBarInner');
  bar.style.animation = 'none'; bar.offsetHeight; bar.style.animation = '';

  try {
    // 單次呼叫：一次取得公司頁與職缺頁兩組評分
    loadSub.textContent = '分析公司頁與職缺頁性格需求…';
    const res = await callAPI(buildPrompt(company, job));
    const parsed = safeParseJSON(res);
    if (!parsed || !parsed.company || !parsed.job) {
      console.error('原始回應:', res.slice(0, 500));
      throw new Error('分析解析失敗（token 可能不足，請稍後重試）');
    }

    // 拆成與後續流程相容的 dataA（公司頁）/ dataB（職缺頁）
    const dataA = { jobTitle: parsed.jobTitle, companyName: parsed.companyName, traits: parsed.company };
    const dataB = { jobTitle: parsed.jobTitle, companyName: parsed.companyName, traits: parsed.job };

    loadSub.textContent = '合併計算公司職缺分析…';

    // Compute combined scores
    const combined = computeCombined(dataA, dataB);

    loadWrap.classList.remove('active');
    renderResults(dataA, dataB, combined);

  } catch(err) {
    loadWrap.classList.remove('active');
    btn.disabled = false;
    showToast(`分析失敗：${err.message}`);
  }
}

async function callAPI(prompt) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 32000,
      temperature: 0,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  const data = await response.json();
  if (data.error) throw new Error(data.error.message);
  return data.content.map(i => i.text || '').join('');
}

function computeCombined(dataA, dataB) {
  // Build lookup by traitCode
  const mapA = {};
  const mapB = {};
  (dataA.traits || []).forEach(t => { mapA[t.traitCode] = t; });
  (dataB.traits || []).forEach(t => { mapB[t.traitCode] = t; });

  const combined = { jobTitle: dataB.jobTitle || dataA.jobTitle, companyName: dataA.companyName || dataB.companyName, traits: [] };

  ALL_TRAITS.forEach(base => {
    const tA = mapA[base.code];
    const tB = mapB[base.code];
    const scoreA = tA ? (tA.score || 1) : 1;
    const scoreB = tB ? (tB.score || 1) : 1;
    const rawScore = (scoreA * 1 + scoreB * 2) / 3;
    // Round to 1 decimal place, clamp 1-5
    const score = Math.min(5, Math.max(1, Math.round(rawScore * 10) / 10));

    // Merge evidences from both
    const evA = tA ? (tA.evidences || (tA.ev ? [tA.ev] : [])) : [];
    const evB = tB ? (tB.evidences || (tB.ev ? [tB.ev] : [])) : [];
    const evidences = [...new Set([...evB, ...evA])].filter(Boolean).slice(0, 3);

    combined.traits.push({
      traitCode: base.code,
      trait: base.name,
      factor: base.factor,
      definition: (tB && (tB.definition||tB.def)) || (tA && (tA.definition||tA.def)) || '',
      score,
      scoreA,
      scoreB,
      scoreReason: (tB && (tB.scoreReason||tB.reason)) || (tA && (tA.scoreReason||tA.reason)) || '',
      evidences,
    });
  });

  return combined;
}

function switchPart(part) {

  const container = document.getElementById('partContent');

  if (part === 'part1') renderPart(container, combined, 'Part1. 公司職缺分析', SCORE_LABELS_C, true);
  else if (part === 'part2') renderPart(container, dataB, 'Part2. 職缺頁的性格分析結果', SCORE_LABELS, false);

function showDemo() {
  const { dataA, dataB } = DEMO_STATIC;
  const combined = computeCombined(dataA, dataB);
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('jobTraitsPanel').style.display = '';
  renderResults(dataA, dataB, combined);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPart(container, data, title, scoreLabels, isCombined) {
  const traits = [...(data.traits || [])].sort((a, b) => b.score - a.score);

  const rows = traits.map((t, i) => {
    const col = FACTOR_COLORS[t.factor] || { bg: '#f5f5f5', border: '#ccc', dot: '#666' };
    let scoreLabel, scoreCls;
    if (isCombined) {
      scoreLabel = getScoreLabelC(t.score);
      const clsScore = t.score <= 1.40 ? 1 : t.score <= 2.40 ? 2 : t.score <= 3.40 ? 3 : t.score <= 4.40 ? 4 : 5;
      scoreCls = `score-badge-${clsScore}`;
    } else {
      scoreLabel = scoreLabels[t.score] || '';
      const clsScore = t.score <= 1.40 ? 1 : t.score <= 2.40 ? 2 : t.score <= 3.40 ? 3 : t.score <= 4.40 ? 4 : 5;
      scoreCls = `score-badge-${clsScore}`;
    }

    const combinedNote = isCombined
      ? `<div style="font-size:10.5px;color:#888;margin-bottom:4px;">公司頁得分：${t.scoreA}　職缺頁得分：${t.scoreB}　→ 綜合：(${t.scoreA}×1 + ${t.scoreB}×2) / 3 ＝ <b>${t.score.toFixed(1)}</b>（${scoreLabel}）</div>`
      : '';

    const evList = t.evidences && t.evidences.length ? t.evidences : (t.ev ? [t.ev] : []);
    const evHTML = evList.filter(e => e).map(e =>
      `<div class="evidence-row">
        <span class="evidence-icon" style="color:${col.dot};">❝</span>
        <span class="evidence-text">${e}</span>
      </div>`
    ).join('');

    return `
      <div class="trait-row" style="border-left:4px solid ${col.dot};">
        <div class="trait-row-header">
          <div style="width:22px;height:22px;border-radius:50%;background:${col.dot};color:white;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${i+1}</div>
          <span class="trait-name">${t.trait}</span>
          <span class="trait-typical">${TRAIT_TYPICAL[t.traitCode] || ''}</span>
          <span class="score-chip ${scoreCls}">▶ ${isCombined ? t.score.toFixed(1) : t.score}分　${scoreLabel}</span>
        </div>
        <div class="trait-def">向度定義：${t.definition || t.def || ''}</div>
        ${combinedNote}
        <div class="trait-need-label">📌 為何需要這個向度</div>
        <div class="trait-need-text">${t.scoreReason || t.reason || ''}</div>
        ${evHTML ? `<div class="trait-need-label">🔍 文本佐證</div>${evHTML}` : ''}
      </div>`;
  }).join('');

  container.innerHTML = `
    <div style="font-size:15px;font-weight:800;color:#1a1a2e;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #e0e0e8;">${title}</div>
    ${rows}
  `;
}

    });
    const numStyle = (rgb) => ({
      ...cellStyle(rgb),
      font:      { name: 'Arial', sz: 12, bold: true, color: { rgb: '1A3A5C' } },
      alignment: { horizontal: 'center', vertical: 'center' },
    });
    const FACTOR_BG = {
      '情緒穩定': 'EFF6FF',
      '親和樂群': 'F0FDF4',
      '勤勉審慎': 'FFFBEB',
      '外向實踐': 'F5F3FF',
      '經驗開放': 'F0FDFA',
    };

    // ── 評分標籤 ──
    function scoreLabel(score, isComb) {
      if (isComb) {
        if (score <= 1.40) return '完全不需要';
        if (score <= 2.40) return '不太需要';
        if (score <= 3.40) return '部分需要';
        if (score <= 4.40) return '需要';
        return '非常需要';
      }
      return { 1:'完全不需要', 2:'不太需要', 3:'部分需要', 4:'需要', 5:'非常需要' }[score] || '';
    }

    // ── 建立工作表 ──
    function makeSheet(traits, isCombined) {
      const headers = isCombined
        ? ['排名','向度代碼','向度名稱','所屬因素','公司頁得分','職缺頁得分','公司職缺分析','需要程度','為何需要這個向度','文本佐證']
        : ['排名','向度代碼','向度名稱','所屬因素','分數','需要程度','為何需要這個向度','文本佐證'];

      const sorted = [...traits].sort((a, b) => b.score - a.score);
      const aoa = [headers];

      sorted.forEach((t, i) => {
        const bg = FACTOR_BG[t.factor] || 'FFFFFF';
        const ev = t.evidences && t.evidences.length
          ? t.evidences.filter(Boolean).join('；')
          : (t.ev || '');
        const reason = t.scoreReason || t.reason || '';

        if (isCombined) {
          aoa.push([
            i + 1,
            t.traitCode,
            t.trait,
            t.factor,
            t.scoreA,
            t.scoreB,
            parseFloat(t.score.toFixed(1)),
            scoreLabel(t.score, true),
            reason,
            ev,
          ]);
        } else {
          aoa.push([
            i + 1,
            t.traitCode,
            t.trait,
            t.factor,
            t.score,
            scoreLabel(t.score, false),
            reason,
            ev,
          ]);
        }
      });

      const ws = XLSX.utils.aoa_to_sheet(aoa);

      // 欄寬
      const colWidths = isCombined
        ? [6, 10, 10, 10, 8, 8, 8, 10, 36, 30]
        : [6, 10, 10, 10, 6, 10, 36, 30];
      ws['!cols'] = colWidths.map(w => ({ wch: w }));

      // 列高（標題列）
      ws['!rows'] = [{ hpt: 30 }];

      // 套用標題樣式
      headers.forEach((_, ci) => {
        const cell = XLSX.utils.encode_cell({ r: 0, c: ci });
        if (ws[cell]) ws[cell].s = hStyle;
      });

      // 套用資料列樣式
      sorted.forEach((t, ri) => {
        const bg = FACTOR_BG[t.factor] || 'FFFFFF';
        const cols = isCombined ? 10 : 8;
        for (let ci = 0; ci < cols; ci++) {
          const cell = XLSX.utils.encode_cell({ r: ri + 1, c: ci });
          if (!ws[cell]) continue;
          // 排名欄與分數欄用數字樣式
          const isRank  = ci === 0;
          const isScore = isCombined ? (ci >= 4 && ci <= 6) : ci === 4;
          ws[cell].s = (isRank || isScore) ? numStyle(bg) : cellStyle(bg);
        }
      });

      return ws;
    }

    // ── 加入三個工作表 ──
    XLSX.utils.book_append_sheet(wb, makeSheet(combined.traits, true),  'Part1 公司職缺分析');
    XLSX.utils.book_append_sheet(wb, makeSheet(dataB.traits,    false), 'Part2 職缺頁');
    XLSX.utils.book_append_sheet(wb, makeSheet(dataA.traits,    false), 'Part3 公司頁');

    // ── 檔名 ──
    const now = new Date();
    const ts  = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    const name = [companyName, jobTitle].filter(Boolean).join('_') || '性格向度分析';
    XLSX.writeFile(wb, `${name}_${ts}.xlsx`, { bookSST: false, type: 'binary', cellStyles: true });

    showToast('✅ Excel 已匯出下載！');
  } catch(e) {
    console.error('匯出失敗', e);
    showToast('匯出失敗：' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg> 匯出 Excel';
  }
}
</script>
