 <!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ff6600" />
<title>104AI職涯教練｜▶︎召喚我的AI職涯教練</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans TC","PingFang TC",sans-serif;line-height:1.5;background:#f6f7fb;color:#1f2328;-webkit-font-smoothing:antialiased}
  img,svg{display:block;max-width:100%}
  button,input,textarea{font:inherit}
  :root{
    --brand:#ff6600;--brand-600:#e65a00;--ink:#1f2328;--muted:#5b616e;--ring:#e6e8ef;--card:#fff;--bg:#f6f7fb;
    --radius:14px;--shadow:0 6px 18px rgba(23,26,31,.06);
    --fs-12:clamp(12px, 0.75rem, 0.75rem);
    --fs-14:clamp(13px, 0.9vw + 10px, 14px);
    --fs-16:clamp(15px, 1.2vw + 10px, 16px);
    --fs-18:clamp(16px, 1.4vw + 10px, 18px);
    --fs-22:clamp(18px, 1.2rem + 0.8vw, 22px);
    --fs-28:clamp(22px, 1.2rem + 1.6vw, 28px);
    --zoom:1;
  }
  @media (prefers-color-scheme: dark){
    :root{--ink:#e7e9ee;--muted:#aeb4c0;--ring:#2c3340;--card:#0e1116;--bg:#0a0d12}
    body{background:var(--bg);color:var(--ink)}
  }
  header{position:sticky;top:0;z-index:10;backdrop-filter:saturate(160%) blur(8px);
    background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.65));
    border-bottom:1px solid var(--ring)}
  @media (prefers-color-scheme: dark){
    header{background:linear-gradient(180deg, rgba(14,17,22,.85), rgba(14,17,22,.55))}
  }
  .header-inner{max-width:min(1000px, 92vw);margin:0 auto;padding:18px 8px 10px}
  .title{font-weight:800;font-size:var(--fs-28);letter-spacing:.01em}
  .sub{color:var(--muted);font-size:var(--fs-14);margin-top:2px}
  .wrap{max-width:min(1000px, 92vw);margin:16px auto 40px;padding:0 4px}
  .card{background:var(--card);border:1px solid var(--ring);border-radius:var(--radius);box-shadow:var(--shadow)}
  .landing{padding:16px;display:grid;gap:12px}
  .muted{color:var(--muted);font-size:var(--fs-14)}
  .hint{color:var(--muted);font-size:var(--fs-12)}
  .qtitle{font-size:var(--fs-22);font-weight:800;margin:4px 0}
  .btn{appearance:none;border:1px solid transparent;background:var(--brand);color:#fff;border-radius:10px;padding:.8em 1.1em;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:.5em;box-shadow:0 1px 0 rgba(0,0,0,.05);transition:transform .06s ease, background .2s ease, box-shadow .2s ease}
  .btn:hover{background:var(--brand-600)}
  .btn:active{transform:translateY(1px)}
  .btn.secondary{background:#444e60}
  .btn.ghost{background:transparent;color:#1f2328;border-color:var(--ring)}
  .btn.block{width:100%;justify-content:center}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:12px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .field{flex:1 1 auto;min-width:240px;padding:.8em .9em;border:1px solid var(--ring);border-radius:10px;font-size:var(--fs-16);background:var(--card);color:inherit}
  .field:focus{outline:2px solid transparent;box-shadow:0 0 0 3px rgba(255,102,0,.25)}
  .unit{padding:.55em .8em;border:1px solid var(--ring);border-radius:10px;background:#f2f3f5;color:#1f2328}
  @media (prefers-color-scheme: dark){ .unit{background:#1c2430;color:#e7e9ee;border-color:#2c3340} }
  .grid{display:grid;gap:10px}
  .cols-2{grid-template-columns:1fr}
  @media(min-width:640px){.cols-2{grid-template-columns:1fr 1fr}}
  @media(min-width:900px){.cols-3{grid-template-columns:repeat(3,1fr)}}
  .chip{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--ring);border-radius:999px;background:#f2f3f5;color:#1f2328;cursor:pointer;user-select:none;outline:none;font-weight:500}
  .chip b{font-variant-numeric:tabular-nums}
  .chip:hover{background:#e9eaee}
  .chip:active{background:#ffd6bf}
  .chip:focus-visible{box-shadow:0 0 0 3px rgba(255,102,0,.25)}
  .chip.sel{background:#ffe0cc;border-color:#ff6600;color:#1f2328;position:relative;overflow:hidden}
  .chip.sel::before{content:'';position:absolute;inset:0;border-radius:999px;background:rgba(255,102,0,.08);pointer-events:none}
  .chip.sel[data-order]::after{content:attr(data-order);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a04300;font-weight:800;font-size:20px;line-height:1;pointer-events:none;width:32px;height:32px;margin:auto;border-radius:50%;background:#fff}
  @media (prefers-color-scheme: dark){
    .chip{background:#1c2430;color:#e7e9ee;border-color:#2c3340}
    .chip:hover{background:#212b39}
    .chip:active{background:#40332a}
    .chip.sel{background:#3a2a22;border-color:#ff8a4a;color:#fff}
    .chip.sel::before{background:rgba(255,138,74,.12)}
    .chip.sel[data-order]::after{background:#2b211b;color:#ffd6bf}
  }
  .progress{position:sticky;top:58px;height:10px;background:#e9ebf3;border-radius:999px;overflow:hidden;margin:0 0 14px}
  .bar{height:100%;background:var(--brand);width:0;transition:width .25s ease}
  textarea{width:100%;min-height:44vh;resize:vertical}
  .safe-bottom{padding-bottom:calc(env(safe-area-inset-bottom, 0) + 6px)}
  @media (max-width:360px){ .btn{padding:.7em .9em} .chip{padding:10px 12px} }
  .btn.ghost.inline-link{padding:2px 6px;font-size:var(--fs-12);line-height:1.4;display:inline-flex;align-items:center;margin-left:4px;text-decoration:none}
  .btn.ghost.inline-link:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .sel-strip{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
  .sel-pill{background:transparent;border:none;color:#1f2328;font-weight:600;font-size:var(--fs-14);padding:0;}
  .sel-pill b{font-variant-numeric:tabular-nums;color:#a04300}
  @media (prefers-color-scheme: dark){ .sel-pill{color:#ffe0cc} .sel-pill b{color:#ffb380} }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes popIn { 0% { transform: scale(.6); opacity: 0 } 60% { transform: scale(1.05); opacity: 1 } 100% { transform: scale(1) } }
  .chip.sel::before{animation: fadeIn .18s ease-out}
  .chip.sel::after{animation: popIn .22s ease-out}
  :root{ --fs-12: calc(12px * var(--zoom)); --fs-14: calc(14px * var(--zoom)); --fs-16: calc(16px * var(--zoom)); --fs-18: calc(18px * var(--zoom)); --fs-22: calc(22px * var(--zoom)); --fs-28: calc(28px * var(--zoom)); }
  .toolbar-top{position:fixed;right:10px;top:10px;z-index:50;display:flex;gap:6px}
  .btn.icon{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .btn.icon small{font-weight:700}
  .center-text{text-align:center;font-weight:700;margin:18px 0 10px;font-size:var(--fs-18);}
  .ai-btn-group{display:flex;justify-content:center;gap:12px;margin:12px 0 24px;}
  .ai-btn{width:120px;height:120px;padding:0;border:1px solid var(--ring);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;font-weight:700;font-size:var(--fs-16);color:var(--ink);background:var(--card);transition:all .1s ease}
  .ai-btn:hover{background:#f2f3f5;transform:translateY(-1px);box-shadow:0 3px 12px rgba(23,26,31,.08)}
  .ai-btn:active{transform:translateY(1px);box-shadow:none}
  .ai-btn span{margin-top:8px;font-size:var(--fs-16)}
  .ai-btn svg{ margin-bottom: 2px;} 
  @media (prefers-color-scheme: dark){ .ai-btn{background:#1c2430;color:#e7e9ee;border-color:#2c3340} .ai-btn:hover{background:#212b39} }
  .restart-hint{text-align:center;font-size:var(--fs-16);margin-top:20px;margin-bottom:10px}

  /* ---- 新增：彙整預覽（可讀版） ---- */
  .summary{display:grid;gap:12px;margin-top:8px}
  .section{padding:14px;border:1px solid var(--ring);border-radius:var(--radius);background:var(--card)}
  .sec-title{font-weight:800;font-size:var(--fs-18);margin:2px 0 10px}
  .dl{display:grid;grid-template-columns:160px 1fr;gap:8px 14px}
  .dl dt{margin:0;color:var(--muted)}
  .dl dd{margin:0;white-space:pre-wrap;line-height:1.8}
  @media (max-width:640px){ .dl{grid-template-columns:1fr} .dl dt{opacity:.9} }
  .tagline{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .tag{display:inline-block;border:1px solid var(--ring);border-radius:999px;padding:.25em .7em;font-size:var(--fs-14)}
  .list{margin:0;padding-left:1.2em}
  .list li{margin:.3em 0;white-space:pre-wrap;line-height:1.7}
  details.copybox{margin-top:14px; text-align: center;}
  details.copybox textarea{min-height:30vh;}
  .none-wrap{margin-top:8px;font-size:var(--fs-16);}
  .none-wrap label{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
  .none-wrap input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);}
</style>
</head>
<body>
  <div class="toolbar-top" aria-label="字級調整">
    <button class="btn icon" id="zoomOut" title="縮小字級"><small>A−</small></button>
    <button class="btn icon" id="zoomIn" title="放大字級"><small>A＋</small></button>
  </div>
  <header>
    <div class="header-inner">
      <div class="title">104AI職涯教練 | 用AI陪伴你探索職涯方向，為你的職涯解惑。</div>
      <div class="sub"> 一鍵生成啓動AI職涯教練的 Prompt → 將生成的 Prompt 貼到 ChatGPT、Gemini 或 Copilot → 取得職涯競爭力報告＆啓動你的AI職涯教練</div>
      <div class="sub"> ※ 這個平台不會記錄你任何的資料。產生的 AI職涯教練 Prompt 請自行複製保留 ※</div>

    </div>
  </header>
  <main class="wrap">
    <section class="card landing" id="landing" aria-label="起始畫面">
      <div class="grid">
        <button class="btn block" id="startBtn" aria-label="啟動引導">▶︎ 召喚我的AI職涯教練</button>
        <button class="btn secondary block" id="sampleBtn" aria-label="載入範例">✨ 載入範例，先體驗看看</button>
      </div>
      <p class="hint">提示：沒有相關資訊可勾選「無」。</p>
    </section>
    <div id="stage" class="safe-bottom" style="margin-top:14px"></div>
  </main>

<script>
document.addEventListener('DOMContentLoaded', function(){
try{
  const stage = document.getElementById('stage');
  const landing = document.getElementById('landing');

  const S = { step:0, total:24,
    eduLevel:null,
    age:'', expYears:'',
    eduField:'', eduNone:false,
    eduLike:null,
    skillPaper:'', skillNone:false,
    groupNow:'', groupNowNone:false,
    groupNext:'', groupNextNone:false,
    jobNow:'', jobNowNone:false,
    jobPrev:'', jobPrevNone:false,
    jobOther:'', jobOtherNone:false,
    licenses:'', licensesNone:false,
    skill:'', skillNone:false,
    manageYears:'', manageNone:false,
    flow1:'', flow1None:false,
    flow2:'', flow2None:false,
    flow3:'', flow3None:false,
    flow4:'', flow4None:false,
    flow5:'', flow5None:false,
    valuesSel:[], interestsSel:[], miSel:[]
  };

  const eduLevelOpts = [
    [1,'目前正在就讀高中職。'],[2,'高中職畢業。'],
    [3,'目前正在就讀大學。'],[4,'大學畢業。'],
    [5,'目前正在就讀碩士。'],[6,'碩士畢業。'],
    [7,'目前正在就讀博士。'],[8,'博士畢業。'],
    [9,'其他']
  ];
  const valuesOpts=[[1,'具有影響力：工作能讓我獲得影響力，取得良好的社會地位與聲望。'],[2,'理念要有共鳴：工作或公司文化能符合我的核心價值。'],[3,'樂於接受挑戰：工作有挑戰性，使我能從工作中持續獲得成就感。'],[4,'終身學習最幸福：工作能提供學習成長機會，有利未來的專業發展或升遷。'],[5,'公平最重要：工作的分派、管理、賞罰、薪酬分配都公平合理。'],[6,'穩定生產力：工作是在安全舒適的環境中進行，不擔心被任意調動職務或失業。'],[7,'重視薪水福利：工作提供的薪資福利，可讓我維持良好生活品質。'],[8,'目標流程清楚：工作有清楚的流程及規範可依循，可以具體地評估工作成果。'],[9,'工作符合興趣：工作內容符合我的興趣，讓我能樂在工作。'],[10,'熱愛多樣化任務：工作內容豐富多元，不會一成不變。'],[11,'自由不受限：工作時我能自行規劃工作方式，不受別人的阻礙或控制。'],[12,'創意獨特：工作能發揮自己的長才與優勢，創造獨特的價值。'],[13,'工作生活平衡：工作能讓我兼顧家庭和休閒生活。'],[14,'服務他人：工作讓我能幫助他人，為社會大眾服務。'],[15,'鼓勵起手式：主管能重視並肯定我，在工作中提供我指導、支持與鼓勵。'],[16,'歡樂工作氣氛：同事間能互助合作，有良好工作氛圍，讓人有歸屬感。']];
  const interestOpts = [[1,'R.實作型：喜歡具體、動手操作的任務，常展現解決實際問題的行為。偏好戶外、機械、工具或體力活動。'],[2,'I.研究型：喜歡思考、探究、驗證理論，展現邏輯推理與獨立解決問題。'],[3,'A.藝術型：重視自我表達與創造，偏好音樂、繪畫、設計、表演等高自由度活動。'],[4,'S.社會型：喜歡助人、協作與引導他人，偏好溝通、人際互動與服務工作。'],[5,'E.企業型：喜歡影響與說服他人，展現領導、組織與決策的行為。'],[6,'C.事務型：喜歡有結構與秩序的環境，擅長處理數據、文件、流程。']];
  const miOpts=[[1,'邏輯數學：擅長推理思考，喜歡提問尋找答案。'],[2,'語言文字：善於表達，喜歡閱讀、撰寫創作。'],[3,'自然觀察：喜歡觀察生態，對飼養動物、栽種植物有興趣。'],[4,'肢體動覺：擅長用身體表達與動手操作。'],[5,'空間藝術：用圖像思考，喜歡繪畫、設計與空間規劃。'],[6,'音樂旋律：易記旋律，能辨別音調，喜歡樂器。'],[7,'人際互動：擅長觀察情緒，喜歡團體活動與帶領。'],[8,'內省同理：擅長探索自己與同理他人，能安靜獨處。']];

  const sample = {
    eduLevel:8,
    age:'55',
    expYears:'30',
    eduLike:5,
    eduField:
`大學是念心理系，主修工商心理學組。輔系是修讀企管系與新聞系。
碩士是念心理研究所，主修工商心理學。
博士是念心理研究所，主修工商心理學，輔修心理輔導。`,
    skillPaper:
`擅長科目有：人力資源管理、組織心理學、領導心理學、心理輔導、正向心理學、心理測驗、統計、SPSS。
碩士論文：目標設定對工作動機的影響。
博士論文：部屬對領導者的知覺與因應行為。`,
    groupNow:'政大蘭友會返鄉服務隊/總召,隊輔/看見自己喜歡和大家一起用寓教於樂的方式幫助別人/3年。',
    groupNext:'心理系學會/系代/和一群志同道合的伙伴完成20週年系慶各項活動/1年。',
    jobNow:'人力銀行/職涯永續長/執行中學生、大學生職涯教育工作，發展職涯探索工具與服務，培訓職涯引導師與職涯志工/15年。',
    jobPrev:'資訊科技製造產業/員工發展室專案顧問/發展＆執行員工職涯規劃方案，協助各部門團隊建立活動/3年。',
    jobOther:'國立大學/心理系助理教授/負責人力資源管理、領導心理學、統計、質化研究...課程，主持國科會、國防部研究專案，指導研究生論文計畫，協助企業執行甄選測驗建置計畫/5年。',
    licenses:'教育部助理教授證書、TA溝通交流分析。',
    skill:'職涯諮詢, 教育訓練設計, 心理測驗編製, 統計分析。',
    manageYears:'15',
    flow1:'大學期間，參加返鄉服務隊，陪伴偏鄉國小兒童探索個人優勢天賦。',
    flow2:'在人力銀行服務期間，負責培訓150位104職涯引導師，提升他們職涯諮詢與引導的技巧。',
    flow3:'在服役期間擔任巡迴教官，負責官兵的情緒管理及職涯規劃教育。',
    flow4:'在人力銀行服務期間，與博幼基金會合作協助偏鄉中小學生探索工作世界。',
    flow5:'在博士班就讀期間，擔任宏碁電腦員工發展室專案顧問，協助公司同仁的職涯規劃＆部門的團隊建立活動。',
    values:[14,1,2], interests:[4,5], mi:[8,7,2]
  };

  function hideLanding(){ landing.hidden = true; landing.setAttribute('aria-hidden','true'); }
  function showLanding(){ landing.hidden = false; landing.removeAttribute('aria-hidden'); }
  function start(){ S.step=1; hideLanding(); render(); }
  function loadSample(){
    Object.assign(S, {
      step:1,
      age: sample.age,
      expYears: sample.expYears,
      eduLevel:sample.eduLevel,
      eduField:sample.eduField, eduNone:false,
      eduLike: (sample.eduLike ?? 5),
      skillPaper:sample.skillPaper, skillNone:false,
      groupNow:sample.groupNow, groupNowNone:false,
      groupNext:sample.groupNext, groupNextNone:false,
      jobNow:sample.jobNow, jobNowNone:false,
      jobPrev:sample.jobPrev, jobPrevNone:false,
      jobOther:sample.jobOther, jobOtherNone:false,
      licenses:sample.licenses, licensesNone:false,
      skill:sample.skill, skillNone:false,
      manageYears:sample.manageYears, manageNone:false,
      flow1:sample.flow1, flow1None:false,
      flow2:sample.flow2, flow2None:false,
      flow3:sample.flow3, flow3None:false,
      flow4:sample.flow4, flow4None:false,
      flow5:sample.flow5, flow5None:false,
      valuesSel:sample.values.slice(), interestsSel:sample.interests.slice(), miSel:sample.mi.slice()
    });
    hideLanding(); render();
  }
  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('sampleBtn').addEventListener('click', loadSample);

  (function(){
    const root = document.documentElement;
    const saved = localStorage.getItem('zoom') || '1';
    root.style.setProperty('--zoom', saved);
    function setZoom(z){
      z = Math.max(0.85, Math.min(1.4, Math.round(z*100)/100));
      root.style.setProperty('--zoom', z);
      localStorage.setItem('zoom', z);
    }
    document.getElementById('zoomIn').addEventListener('click', ()=> setZoom(parseFloat(getComputedStyle(root).getPropertyValue('--zoom')) + 0.1));
    document.getElementById('zoomOut').addEventListener('click', ()=> setZoom(parseFloat(getComputedStyle(root).getPropertyValue('--zoom')) - 0.1));
  })();

  function openAI(type){
    let webUrl, universalUrl, schemeUrl;
    if(type === 'ChatGPT'){
        webUrl='https://chatgpt.com/';
        universalUrl='https://chat.openai.com/';
        schemeUrl='chatgpt://';
    }else if(type === 'Gemini'){
        webUrl='https://gemini.google.com/app';
        universalUrl='https://gemini.google.com/app';
        schemeUrl='gemini://';
    }else if(type === 'Copilot'){
        webUrl='https://copilot.microsoft.com/';
        universalUrl='https://copilot.microsoft.com/';
        schemeUrl='ms-chat://';
    }else{
        return;
    }
    const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    const isAndroid=/android/i.test(navigator.userAgent);
    let fallbackTimer;
    const fallback=()=>{ window.open(universalUrl,'_blank','noopener') || window.open(webUrl,'_blank','noopener'); };
    const onVis=()=>{ if(document.hidden){ clearTimeout(fallbackTimer); document.removeEventListener('visibilitychange', onVis);} };
    document.addEventListener('visibilitychange', onVis);
    try{
      if(isIOS || isAndroid){
        const iframe=document.createElement('iframe'); iframe.style.display='none'; iframe.src=schemeUrl; document.body.appendChild(iframe);
        fallbackTimer=setTimeout(fallback,700); setTimeout(()=>iframe.remove(),1500);
      }else{
        fallback();
      }
    }catch(e){ fallback(); }
  }

  function aiLogoSvg(type) {
    let path = ''; let viewBox = "0 0 48 48"; let size = 42; let defs = ''; let fill = "currentColor";
    if (type === 'ChatGPT') {
      size = 50; viewBox = "0 0 41 41"; fill = "url(#gpt-grad)";
      defs = `<defs><linearGradient id="gpt-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#10a37f;stop-opacity:1" /><stop offset="100%" style="stop-color:#34b391;stop-opacity:1" /></linearGradient></defs>`;
      path = `<path d="M37.5 20.5a17 17 0 1 1-3.6-10.5l.3-.4L41 0l-7.7 7.7a20.2 20.2 0 0 1-5.7-1.3l-.2-.3a17 17 0 0 1-9.9 3.4l-.2.1a17 17 0 0 1 1.7 17.7zM17 10.3a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm7 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM17 24a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm7 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>`;

      size = 40; path = `<circle cx="24" cy="24" r="8" fill="#FFC107"/><circle cx="38" cy="18" r="5" fill="#4CAF50"/><circle cx="10" cy="18" r="5" fill="#F44336"/><circle cx="24" cy="38" r="5" fill="#03A9F4"/>`; fill = "none";

  function progress(){
    const pct=Math.round(Math.min(S.step,S.total)/S.total*100);
    return '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><div class="bar" style="width:'+pct+'%"></div></div>';
  }
  function nav(){
    if (S.step < 1 || S.step >= S.total) return '';
    return '<div class="toolbar" role="toolbar" aria-label="導覽按鈕">'
      +(S.step>1?'<button class="btn ghost" id="prev" aria-label="上一題">← 上一題</button>':'')
      +'<button class="btn" id="next" aria-label="下一題">下一題 →</button>'
      +'</div>';
  }
  function chips(opts, selected, multi){
    let html='<div class="grid cols-2">';
    for(const [id, text] of opts){
      const isSel = multi ? selected.includes(id) : selected===id;
      const order = multi && isSel ? (selected.indexOf(id)+1) : '';
      const state = isSel? ' sel' : '';
      html +=  (multi && isSel ? ('<button type="button" class="chip'+state+'" data-id="'+id+'" data-order="'+order+'"><b>(' + id + ')</b><span>'+text+'</span></button>') : ('<button type="button" class="chip'+state+'" data-id="'+id+'"><b>(' + id + ')</b><span>'+text+'</span></button>'));
    }
    html+='</div>'; return html;
  }
  function bindChips(set){
    stage.querySelectorAll('.chip').forEach(el=>{
      el.addEventListener('click',()=>{ const id=+el.getAttribute('data-id'); set(id); render(); });
      el.addEventListener('keydown',(e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); el.click(); }});
    });
  }
  function toggleSingle(setter){ return (id)=>setter(id); }
  function toggleMulti(arr,id,cap){
    const i=arr.indexOf(id);
    if(i>=0){arr.splice(i,1);return;}
    if(arr.length<cap){arr.push(id);} }

  function selView(opts, selected){
    if(!selected || !selected.length) return '<div class="hint">尚未選擇。</div>';
    let html='<div class="sel-strip" id="selStrip">';
    for(const id of selected){
      const o = opts.find(o=>o[0]===id); if(!o) continue;
      html += '<span class="sel-pill"><b>(' + id + ')</b> '+o[1].replace(/<[^>]+>/g,'')+'</span>';
    }
    html+='</div>'; return html;
  }

  function qWrap(title, hint, inner){
    stage.innerHTML = progress()+`<section class="card" style="padding:16px" aria-live="polite"><div class="qtitle">${title}</div>${hint?`<div class="hint">${hint}</div>`:''}<div class="grid" style="margin-top:10px">${inner}</div>${nav()}</section>`;
    const p=stage.querySelector('#prev'); if(p) p.onclick=()=>{S.step--; render();};
    const n=stage.querySelector('#next'); if(n) n.onclick=()=>{S.step++; render();};
    const firstFocusable = stage.querySelector('input, textarea, .chip, .btn');
    if(firstFocusable) firstFocusable.focus({preventScroll:true});
  }

    if(ok){ toast('已複製到剪貼簿！'); } else { alert('複製被瀏覽器阻擋，請按 Ctrl/Cmd + C'); }
  }
  function escape(s){ return String(s??'').replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch])); }
  function findById(arr,id){ const f=arr.find(a=>a[0]===id); return f?f[1]:''; }

  function reset(){ Object.assign(S, { step:0, total:24,
    eduLevel:null,
    age:'', expYears:'',
    eduField:'', eduNone:false,
    eduLike:null,
    skillPaper:'', skillNone:false,
    groupNow:'', groupNowNone:false,
    groupNext:'', groupNextNone:false,
    jobNow:'', jobNowNone:false,
    jobPrev:'', jobPrevNone:false,
    jobOther:'', jobOtherNone:false,
    licenses:'', licensesNone:false,
    skill:'', skillNone:false,
    manageYears:'', manageNone:false,
    flow1:'', flow1None:false,
    flow2:'', flow2None:false,
    flow3:'', flow3None:false,
    flow4:'', flow4None:false,
    flow5:'', flow5None:false,
    valuesSel:[], interestsSel:[], miSel:[]
  }); showLanding(); stage.innerHTML=''; }

  function compiledText(){
    const levelTxt = (S.eduLevel ? '(' + S.eduLevel + ')' : '');
    const likeMap = {1:'非常不喜歡',2:'不喜歡',3:'普通',4:'喜歡',5:'非常喜歡'};
    const L1 = `1.我的最高學歷是：${levelTxt}${findById(eduLevelOpts,S.eduLevel)}`;
    const L2 = `2.我目前的年齡是：${S.age || '（未填）'} 歲`;
    const L3 = `3.我目前累積的工作年資大約是：${S.expYears || '（未填）'} 年`;
    const L4 = `4.我對就讀的專業領域：${S.eduFieldNone?'無。':(S.eduField||'')}`;
    const L5 = `5.我就讀專業領域的喜歡程度：${S.eduLike?('('+S.eduLike+')'):''}${S.eduLike?likeMap[S.eduLike]:'（未選擇）'}`;
    const L6 = `6.我擅長的科目、做過的專題、論文或參與過的競賽：${S.skillNone?'無。':(S.skillPaper||'')}`;
    const L7 = `7.我最近或目前參與的社團是：${S.groupNowNone?'無。':(S.groupNow||'')}`;
    const L8 = `8.我還有參與過那個讓我印象深刻，收穫滿滿的社團：${S.groupNextNone?'無。':(S.groupNext||'')}`;
    const L9 = `9.我最近或目前從事的工作是：${S.jobNowNone?'無。':(S.jobNow||'')}`;
    const L10 = `10.我更早之前從事的工作是：${S.jobPrevNone?'無。':(S.jobPrev||'')}`;
    const L11 = `11.我還從事過那個比較有成就感的工作：${S.jobOtherNone?'無。':(S.jobOther||'')}`;
    const L12 = `12.我擁有的證照：${S.licensesNone?'無。':(S.licenses||'（未填）')}`;
    const L13 = `13.我累積的技能：${S.skillNone?'無。':(S.skill||'（未填）')}`;
    const L14 = `14.我的管理經驗：${S.manageNone?'無。':(S.manageYears?S.manageYears+'年。':'（未填）')}`;
    const L15 = `心流時光說明：已閱讀。`;
    const L16 = `15.我最有心流時光的生命經歷是：${S.flow1None?'無。':(S.flow1||'（未填）')}`;
    const L17 = `16.我第二個比較有心流時光的生命經歷是：${S.flow2None?'無。':(S.flow2||'（未填）')}`;
    const L18 = `17.我第三個比較有心流時光的生命經歷是：${S.flow3None?'無。':(S.flow3||'（未填）')}`;
    const L19 = `18.我第四個比較有心流時光的生命經歷是：${S.flow4None?'無。':(S.flow4||'（未填）')}`;
    const L20 = `19.我第五個比較有心流時光的生命經歷是：${S.flow5None?'無。':(S.flow5||'（未填）')}`;
    const L21 = '20.我比較在乎的三個職業價值觀是：\n' + (S.valuesSel.length? S.valuesSel.map(id=>`(${id}) ${findById(valuesOpts,id)}`).join('\n') : '未選擇');
    const L22 = '21.我比較來勁的二個生涯興趣是：\n' + (S.interestsSel.length? S.interestsSel.map(id=>`(${id}) ${findById(interestOpts,id)}`).join('\n') : '未選擇');
    const L23 = '22.我比較擅長的三個多元智能是：\n' + (S.miSel.length? S.miSel.map(id=>`(${id}) ${findById(miOpts,id)}`).join('\n') : '未選擇');
    return [L1,L2,L3,L4,L5,L6,L7,L8,L9,L10,L11,L12,L13,L14,L15,L16,L17,L18,L19,L20,L21,L22,L23].join('\n');
  }

  // ---- 新增：將 S 組成可讀版 HTML ----
  function buildSummaryHTML(){
    const likeMap = {1:'非常不喜歡',2:'不喜歡',3:'普通',4:'喜歡',5:'非常喜歡'};
    const sec = [];

    // 基本資料
    sec.push(`
      
      <div class="section">
        <div class="sec-title">基本資料</div>
        <dl class="dl">
          <dt>年齡</dt><dd>${escape(S.age || '（未填）')} 歲</dd>
          <dt>累積年資</dt><dd>${escape(S.expYears || '（未填）')} 年</dd>
        </dl>
      </div>`);

    // 學經歷
    sec.push(`
      
      <div class="section">
        <div class="sec-title">學習經歷</div>
        <dl class="dl">
          <dt>最高學歷</dt><dd>${escape(S.eduLevel? '('+S.eduLevel+') '+findById(eduLevelOpts,S.eduLevel) : '（未選）')}</dd>
          <dt>就讀專業領域</dt><dd>${escape(S.eduNone?'無':(S.eduField||'（未填）'))}</dd>
          <dt>就讀專業領域的喜歡程度</dt><dd>${escape(S.eduLike? '('+S.eduLike+') '+({1:'非常不喜歡',2:'不喜歡',3:'普通',4:'喜歡',5:'非常喜歡'}[S.eduLike]||'') : '（未選）')}</dd>
          <dt>擅長科目／論文／專題／競賽</dt><dd>${escape(S.skillNone?'無':(S.skillPaper||'（未填）'))}</dd>
        </dl>
      </div>`);

    // 社團
    sec.push(`
      <div class="section">
        <div class="sec-title">社團經驗</div>
        <dl class="dl">
          <dt>近期／目前</dt><dd>${escape(S.groupNowNone?'無':(S.groupNow||'（未填）'))}</dd>
          <dt>其他印象深刻</dt><dd>${escape(S.groupNextNone?'無':(S.groupNext||'（未填）'))}</dd>
        </dl>
      </div>`);

    // 工作
    sec.push(`
      <div class="section">
        <div class="sec-title">工作經驗</div>
        <dl class="dl">
          <dt>目前工作</dt><dd>${escape(S.jobNowNone?'無':(S.jobNow||'（未填）'))}</dd>
          <dt>更早之前</dt><dd>${escape(S.jobPrevNone?'無':(S.jobPrev||'（未填）'))}</dd>
          <dt>其他成就感工作</dt><dd>${escape(S.jobOtherNone?'無':(S.jobOther||'（未填）'))}</dd>
        </dl>
      </div>`);

    // 證照技能 / 管理
    sec.push(`
      <div class="section">
        <div class="sec-title">證照、技能與管理</div>
        <dl class="dl">
          <dt>證照</dt><dd>${escape(S.licensesNone?'無':(S.licenses||'（未填）'))}</dd>
          <dt>技能</dt><dd>${escape(S.skillNone?'無':(S.skill||'（未填）'))}</dd>
          <dt>管理經驗</dt><dd>${escape(S.manageNone?'無':(S.manageYears?S.manageYears+' 年':'（未填）'))}</dd>
        </dl>
      </div>`);

    // 心流
    const flows = [
      S.flow1None?'無':(S.flow1||'（未填）'),
      S.flow2None?'無':(S.flow2||'（未填）'),
      S.flow3None?'無':(S.flow3||'（未填）'),
      S.flow4None?'無':(S.flow4||'（未填）'),
      S.flow5None?'無':(S.flow5||'（未填）')
    ];
    sec.push(`
      <div class="section">
        <div class="sec-title">心流時光（5則）</div>
        <ol class="list">
          <li>${escape(flows[0])}</li>
          <li>${escape(flows[1])}</li>
          <li>${escape(flows[2])}</li>
          <li>${escape(flows[3])}</li>
          <li>${escape(flows[4])}</li>
        </ol>
      </div>`);

    // 心理測驗（價值觀／興趣／多元智能）
    const tag = (txt)=>`<span class="tag">${escape(txt)}</span>`;
    const values = (S.valuesSel||[]).map(id=>`(${id}) ${findById(valuesOpts,id)}`).map(tag).join('');
    const inters = (S.interestsSel||[]).map(id=>`(${id}) ${findById(interestOpts,id)}`).map(tag).join('');
    const mis = (S.miSel||[]).map(id=>`(${id}) ${findById(miOpts,id)}`).map(tag).join('');
    sec.push(`
      <div class="section">
        <div class="sec-title">心理測驗彙整</div>
        <dl class="dl">
          <dt>職業價值觀（3）</dt><dd class="tagline">${values || '（未選）'}</dd>
          <dt>生涯興趣（2）</dt><dd class="tagline">${inters || '（未選）'}</dd>
          <dt>多元智能（3）</dt><dd class="tagline">${mis || '（未選）'}</dd>
        </dl>
      </div>`);

    return sec.join('');
  }

  render();

}catch(e){
  console.error(e);
}});
</script>
