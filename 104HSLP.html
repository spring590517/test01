<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>【AI學檔教練＿01】我的自我探索學習歷程檔案</title>
<meta name="description" content="提供就讀的科別或班群、參與的社團或活動，及生涯興趣、多元智能＆心流時光...資料，生成可以直接貼到AI的 Prompt。然後將這段 Prompt 貼到你熟悉的AI工具，即可生成「探索生涯興趣的學習歷程檔案」初稿。" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  :root{
    --brand:#ff6600;--brand-600:#e65a00;--ink:#1f2328;--muted:#5b616e;--ring:#e6e8ef;--card:#fff;
    --radius:14px;--shadow:0 6px 18px rgba(23,26,31,.06);
    --font-scale:1;
  }
  body{
    margin:0;color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans TC","PingFang TC",sans-serif;
    line-height:1.65;background:#f6f7fb;
    font-size:calc(18px * var(--font-scale));
    -webkit-font-smoothing:antialiased;
  }
  @media(min-width:900px){ body{font-size:calc(17px * var(--font-scale));} }
  header{position:sticky;top:0;z-index:10;backdrop-filter:saturate(160%) blur(8px);
    background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.7));border-bottom:1px solid var(--ring)}
  .header-inner{max-width:min(980px,92vw);margin:0 auto;padding:12px 8px}
  .head-row{position:relative;display:flex;align-items:center;gap:12px}
  .title-wrap{flex:1;min-width:0;text-align:center;padding:0 clamp(44px, 12vw, 120px)}
  .title{font-weight:800;font-size:clamp(20px, 1.1rem + 2vw, 30px);line-height:1.3}
  .title .tline{display:block}
  @media(max-width:560px){
    .head-row{flex-direction:column;align-items:stretch;gap:8px}
    .title-wrap{padding:0;order:1}
    .fs-ctrl{position:static;transform:none;align-self:flex-end;order:2}
  }
  .sub{color:var(--muted);font-size:clamp(.95rem, .9rem + .4vw, 1.05rem)}
  /* 字級控制：分段式膠囊，小Ａ／大Ａ搭配品牌色正負號 */
  .fs-ctrl{position:absolute;right:0;top:50%;transform:translateY(-50%);
    display:inline-flex;align-items:stretch;background:#fff;border:1px solid var(--ring);
    border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(23,26,31,.08);flex:0 0 auto}
  .fs-btn{appearance:none;border:0;background:transparent;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:1px;
    padding:6px 13px;color:var(--ink);line-height:1;transition:background .15s ease}
  .fs-btn+.fs-btn{border-left:1px solid var(--ring)}
  .fs-btn:hover{background:#fff3ea}
  .fs-btn:active{background:#ffe1cf}
  .fs-btn:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
  .fs-btn .a{font-weight:800;letter-spacing:-.02em}
  .fs-btn .a-sm{font-size:13px}
  .fs-btn .a-lg{font-size:20px}
  .fs-btn .sign{font-size:11px;font-weight:900;color:var(--brand);align-self:flex-start;margin-top:3px}
  .btn{appearance:none;border:1px solid transparent;background:var(--brand);color:#fff;border-radius:10px;padding:.9em 1.1em;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:.5em;transition:transform .06s ease, background .2s ease;font-size:1em}
  .btn:hover{background:var(--brand-600)} .btn:active{transform:translateY(1px)}
  .btn.secondary{background:#444e60}
  .btn.ghost{background:transparent;color:inherit;border:1px solid var(--ring)}
  .btn.block{width:100%;justify-content:center}
  .btn.sm{padding:.45em .7em;border-radius:8px}
  .wrap{max-width:min(980px,92vw);margin:16px auto 0;padding:0 4px calc(120px + env(safe-area-inset-bottom,0))}
  .card{background:var(--card);border:1px solid var(--ring);border-radius:var(--radius);box-shadow:var(--shadow)}
  .landing{padding:16px;display:grid;gap:12px}
  .qtitle{font-size:clamp(1.15rem, 1.05rem + 1vw, 1.6rem);font-weight:800;margin:4px 0}
  .muted{color:var(--muted);font-size:1rem}
  .usage-h{font-weight:800;color:var(--ink);margin-bottom:10px}
  .usage-list{margin:0;padding-left:1.5em;display:grid;gap:12px}
  .usage-list li{line-height:1.65}
  .usage-list li::marker{font-weight:800;color:var(--brand-600)}
  .usage-or{display:inline-block;margin-left:4px;color:var(--brand-600);font-weight:800}
  .hint{color:var(--muted);font-size:.95rem}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:12px}
  .steplabel{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem;color:var(--muted);font-weight:700;margin:0 2px 6px}
  .steplabel b{color:var(--brand-600)}
  .progress{position:relative;height:10px;background:#e9ebf3;border-radius:999px;overflow:hidden;margin:0 0 16px}
  .bar{height:100%;background:linear-gradient(90deg,var(--brand),#ff9147);width:0;transition:width .3s ease}
  .grid{display:grid;gap:10px}
  .cols-2{grid-template-columns:1fr}
  @media(min-width:640px){.cols-2{grid-template-columns:1fr 1fr}}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .field{width:100%;padding:1em 1.1em;border:1px solid var(--ring);border-radius:10px;font-size:1em;background:var(--card)}
  .field:focus{outline:2px solid transparent;box-shadow:0 0 0 3px rgba(255,102,0,.25)}
  textarea{min-height:120px;resize:vertical;line-height:1.6}
  .chip{position:relative;display:flex;align-items:flex-start;gap:12px;padding:16px 46px 16px 16px;border:1px solid var(--ring);border-radius:18px;background:#fafbff;cursor:pointer;user-select:none;font-size:1em;min-height:56px;transition:border-color .15s ease, background .15s ease}
  .chip:active{background:#fff3ea}
  .chip b{font-variant-numeric:tabular-nums;color:var(--muted)}
  .chip.sel{background:#fff7f0;border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
  .chip.sel b{color:var(--brand-600)}
  .chip.sel::after{content:'✓';position:absolute;top:50%;right:12px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:.95em;pointer-events:none}
  .chip.sel[data-order]::after{content:attr(data-order)}
  .sel-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .sel-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px dashed var(--brand);background:#fff7f0;border-radius:999px;font-size:.95rem}
  .sel-pill button{all:unset;cursor:pointer;padding:2px 8px;border-radius:6px;font-size:1.15em;line-height:1}
  .safe-bottom{padding-bottom:calc(env(safe-area-inset-bottom,0) + 8px)}
  /* 放大核取方塊的可點擊範圍，方便手指操作 */
  label.hint{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 4px;cursor:pointer}
  label.hint input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:0 0 auto}

  .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  .appbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:.9em 1.1em;border:1px solid var(--ring);border-radius:12px;background:#fff;cursor:pointer;font-weight:800;box-shadow:var(--shadow)}
  .appbtn:hover{background:#fff7f0;border-color:#ffd0ae}
  .appbtn svg{width:22px;height:22px;display:block}
  .stepcap{font-weight:800;margin-top:8px;margin-bottom:4px}


  .center{text-align:center}
  .right{text-align:right}
  #out{min-height:34vh}
  .bigcopy{display:flex;justify-content:center;margin:8px 0 14px}
  .bigcopy .btn{width:100%;max-width:440px;justify-content:center;gap:.55em}
  #copy svg{flex:0 0 auto}
  /* 結果頁的 Step 標題：放大、加粗、靠左 */
  .steptitle{text-align:left;font-weight:800;color:var(--ink);line-height:1.5;
    font-size:clamp(1.1rem, 1rem + .7vw, 1.32rem);margin:16px 0 4px}
  /* Prompt 方框收合切換：靠右 */
  .out-toggle-row{display:flex;justify-content:flex-end;margin:6px 0 10px}
  .out-toggle{appearance:none;cursor:pointer;border:1px solid var(--ring);background:#fff;
    color:var(--brand-600);font-weight:800;font-size:.95rem;border-radius:999px;
    padding:.5em .95em;display:inline-flex;align-items:center;gap:.4em;transition:background .15s ease, border-color .15s ease}
  .out-toggle:hover{background:#fff7f0;border-color:#ffd0ae}
  .out-toggle:active{background:#ffe1cf}
  .out-toggle .caret{font-size:.85em;transition:transform .2s ease}
  .out-toggle[aria-expanded="true"] .caret{transform:rotate(180deg)}
  .btn.xl{font-size:1.05em;padding:1.05em 1.4em;border-radius:12px}

  /* 固定底部導覽列：手指永遠能碰到「上一題／下一題」 */
  #actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);
    backdrop-filter:saturate(160%) blur(8px);border-top:1px solid var(--ring);
    padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -4px 16px rgba(23,26,31,.06)}
  #actionbar[hidden]{display:none !important}
  .bar-inner{max-width:min(980px,92vw);margin:0 auto;padding:10px 8px}
  .bar-hint{color:var(--brand-600);font-size:.9rem;font-weight:700;text-align:center;margin-bottom:8px}
  .bar-btns{display:flex;gap:10px;align-items:stretch}
  .bar-btns .btn{padding:1.05em 1.1em;font-size:1.02em}
  .bar-btns #prev{flex:0 0 auto;min-width:104px}
  .bar-btns #next{flex:1 1 auto;justify-content:center}
  .btn.is-disabled{background:#c9ccd6;color:#fff;cursor:not-allowed}
  .btn.is-disabled:hover{background:#c9ccd6}
  .appgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0 6px}
  .appcard{background:#fff;border:1px solid var(--ring);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--shadow)}
  .appcard:hover{background:#fff7f0;border-color:#ffd0ae}
  .appicon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid #eee}
  .appname{font-weight:800}
  @media(max-width:420px){ .appgrid{gap:8px} .appcard{padding:12px 6px;border-radius:12px} .appcard .appname{font-size:.9em} }
  .restartwrap{display:flex;justify-content:center;margin-top:10px}

</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="head-row">
      <div class="title-wrap">
        <div class="title"><span class="tline">【AI學檔教練＿01】</span><span class="tline">我的自我探索學習歷程檔案</span></div>
      </div>
      <div class="fs-ctrl" role="group" aria-label="字級調整">
        <button class="fs-btn" id="fsDown" title="縮小字級" aria-label="縮小字級">
          <span class="a a-sm">A</span><span class="sign" aria-hidden="true">−</span>
        </button>
        <button class="fs-btn" id="fsUp" title="放大字級" aria-label="放大字級">
          <span class="a a-lg">A</span><span class="sign" aria-hidden="true">＋</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card landing" id="landing">
    <div class="muted">
      <div class="usage-h">使用說明：</div>
      <ol class="usage-list">
        <li>點選「啟動我的AI學檔教練」：請根據引導提供你的自我探索資訊，生成用來產生你「自我探索學習歷程檔案」的 Prompt。<span class="usage-or">或</span></li>
        <li>點選「載入範例，先玩看看」：一則快速體驗使用程序；二則檢視產生的「自我探索學習歷程檔案」初稿範例。</li>
        <li>這個程式沒有儲存功能，請將生成的 Prompt 自行保存運用。</li>
      </ol>
    </div>
    <div class="grid">
      <button class="btn block" id="startBtn">▶︎ 啟動我的AI學檔教練</button>
      <button class="btn secondary block" id="sampleBtn">✨ 載入範例，先玩看看</button>
    </div>
  </section>
  <div id="stage" class="safe-bottom" style="margin-top:14px"></div>
</main>

<nav id="actionbar" hidden aria-label="題目導覽"></nav>

<script>
(function initApp(){
  const stage = document.getElementById('stage');
  const landing = document.getElementById('landing');
  if(!stage || !landing){ document.addEventListener('DOMContentLoaded', initApp); return; }

  /* --------- 字級控制（A±） --------- */
  const key='fsScaleV2';
  let scale = parseFloat(localStorage.getItem(key)) || 1; // 0.9 ~ 1.4
  function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
  function applyScale(){ document.documentElement.style.setProperty('--font-scale', scale); }
  applyScale();
  document.getElementById('fsUp')?.addEventListener('click', ()=>{ scale = clamp(scale+0.1, 0.9, 1.4); localStorage.setItem(key,scale); applyScale(); });
  document.getElementById('fsDown')?.addEventListener('click', ()=>{ scale = clamp(scale-0.1, 0.9, 1.4); localStorage.setItem(key,scale); applyScale(); });

  /* --------- State --------- */
  const S = {
    step:0,total:13, // ← 新增心流說明頁，總步驟+1
    g1: null, // current grade group
    g2_dept: '', g2_isHS: false,
    club: '', club_none:false,
    riasec: [], // pick 2
    mi: [], // pick 3
    flow1: '', flow1_none:false,
    flow2: '', flow2_none:false,
    flow3: '', flow3_none:false,
    flow4: '', flow4_none:false,
    flow5: '', flow5_none:false,
  };

  /* --------- Options --------- */
  const gradeOpts = [
    [1,'普通型高中一年級'],
    [2,'普通型高中二年級～三年級：人文法政類'],
    [3,'普通型高中二年級～三年級：財經商管類'],
    [4,'普通型高中二年級～三年級：科技工程類'],
    [5,'普通型高中二年級～三年級：生醫衛護類'],
    [6,'技職型高中'],
    [7,'其他（請在下一題補充說明）']
  ];

  const riasecOpts = [
[1,'R.實作型：喜歡具體、動手操作的任務，常展現解決實際問題的行為。偏好戶外、機械、工具或體力活動，較少抽象或人際互動。喜歡明確的工作環境與實際成果。'],[2,'I.研究型：喜歡思考、探究、驗證理論，展現出邏輯推理與獨立解決問題的行為。偏好數理、科學、醫學等需要深入分析的工作，對實驗與知識追求感到興奮。'],[3,'A.藝術型：重視自我表達與創造。常展現創意發想、藝術創作或非傳統思維的行為。偏好音樂、繪畫、設計、表演等自由度高的活動，討厭過度僵化的規範。'],[4,'S.社會型：喜歡助人、協作與引導他人。常展現傾聽、教導、支持他人的行為。偏好溝通、人際互動與服務工作，樂於建立和諧關係。'],[5,'E.企業型：喜歡影響與說服他人，展現領導、組織與決策的行為。偏好充滿挑戰與競爭的環境，樂於承擔風險並追求成就。'],[6,'C.事務型：喜歡有結構與秩序的環境。常展現精準、耐心、追求效率的行為。偏好處理數據、文件、流程，擅長在規範下完成任務。']
  ];
  const miOpts = [
    [1,'邏輯數學：擅長推理思考，喜歡提問尋找答案，對益智遊戲、推理解題活動很感興趣。'],
    [2,'語言文字：口齒伶俐，善於表達。用詞豐富，具說服力。能言善道，喜歡發問、閱讀、撰寫創作。'],
    [3,'自然觀察：喜歡觀察大自然生態，對飼養動物、栽種植物有濃厚興趣，對周圍環境充滿好奇心。'],
    [4,'肢體動覺：擅長運用身體表達想法和感受，喜歡動手操作，偏好以活動為主的工作與學習型態。'],
    [5,'空間藝術：習慣用意象及圖像來思考，喜歡拼圖、迷宮、愛繪畫、設計及空間規劃。'],
    [6,'音樂旋律：能輕易記住歌曲、旋律及辨別音調，可以輕鬆學會樂器，工作學習偏好搭配音樂旋律。'],
    [7,'人際互動：擅長觀察人的情緒，喜歡參與團體活動。善於激勵他人，喜歡扮演團體領導者的角色。'],
    [8,'內省同理：擅長探索自己及同理他人，能意識到自己情緒與想法，能安靜獨處，清楚自己的優缺點。']
  ];

  const sample = {
    step:1,
    g1:2,
    g2_dept:'我是普通高中學生',
    g2_isHS:true,
    club:'吉他社/教學組組長/設計與執行吉他教學課程，偏鄉服務隊/活動部部長/統籌設計讓國小學生探索工作世界的各項活動。',
    riasec:[4,5],
    mi:[8,7,2],
    flow1:'國一的寒假參加四天三夜的全國大露營，擔任小隊長負責帶領小隊成員執行各項任務與競賽，領導的小組獲得精神總錦標的第三名。',
    flow2:'國三升高一暑假用二週的時間跟教會弟兄姊妹騎自行車環島，雖然過程遇到很多狀況與問題，但是在大家團隊合作與互相協助下還是順利完成挑戰。這個活動不僅培養了我的心理素質，也讓我重新認識台灣。',
    flow3:'高一下學期擔任輔導志工團心靈電影院總召集人，讓全校同學用電影認識自己。看見自己喜歡用寓教於樂的方式幫忙大家。',
    flow4:'高二上學期擔任學校樂隊指揮，利用課餘時間＆星期假日揮汗練習。在高二下帶領樂隊獲得全國軍樂競賽亞軍，個人也獲得最佳指揮。',
    flow5:'高二升高三暑假擔任原鄉音樂夏令營副總召，陪伴原住民孩童學習用音樂表達自己，並且讓孩童在部落豐年祭進行演出，獲得部落長老們及縣府教育局長的肯定。'
  };

  /* --------- UI Helpers --------- */
  const QTOTAL = 12; // 問卷互動步驟數（第 13 步為結果頁）
  const progress = () => {
    const shown = Math.min(S.step, QTOTAL);
    const pct = Math.round(shown/QTOTAL*100);
    return `<div class="steplabel"><span>步驟 <b>${shown}</b> / ${QTOTAL}</span><span>${pct}%</span></div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="bar" style="width:${pct}%"></div></div>`;
  };

  /* 是否可前往下一題（關鍵題目需先完成） */
  function canProceed(step){
    if(step===1) return S.g1!=null;
    if(step===4) return S.riasec.length===2;
    if(step===5) return S.mi.length===3;
    return true;
  }
  function proceedHint(step){
    if(step===1) return '請先選擇一個就讀階段';
    if(step===4) return '請依序選滿 2 個生涯興趣';
    if(step===5) return '請依序選滿 3 個多元智能';
    return '';
  }

  /* 固定底部導覽列 */
  function renderActionBar(){
    const bar = document.getElementById('actionbar');
    if(!bar) return;
    if(S.step < 1 || S.step >= 13){ bar.hidden = true; bar.innerHTML = ''; return; }
    bar.hidden = false;
    const ok = canProceed(S.step);
    const nextLabel = (S.step===12) ? '生成 AI Prompt →' : '下一題 →';
    bar.innerHTML = `<div class="bar-inner">

    const multi = Array.isArray(selected);

    for(const [id,text] of opts){
      const isSel = multi ? selected.includes(id) : selected===id;
      const order = multi && isSel ? (selected.indexOf(id)+1) : '';
      html += `<button type="button" class="chip${isSel?' sel':''}" data-id="${id}" ${order?`data-order="${order}"`:''} aria-pressed="${isSel}"><b>(${id})</b><span>${text}</span></button>`;
    }
    html += '</div>';
    setTimeout(()=>{
      stage.querySelectorAll('.chip').forEach(el=>{
        el.onclick = () => {
          const id = +el.getAttribute('data-id');
          if(!multi){ capOrSingle(id); }else{ toggleMulti(selected, id, capOrSingle); }
          render();
        };
        el.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } };
      });
    },0);
    return html;

  function toast(msg){
    const n=document.createElement('div');
    n.textContent=msg;
    Object.assign(n.style,{position:'fixed',left:'50%',bottom:'calc(env(safe-area-inset-bottom,0) + 24px)',transform:'translateX(-50%)',background:'#1f2328',color:'#fff',padding:'10px 14px',borderRadius:'999px',boxShadow:'0 6px 18px rgba(23,26,31,.2)',zIndex:1000});
    document.body.appendChild(n);
    setTimeout(()=>{n.style.opacity='0';n.style.transition='opacity .3s';},1200);
    setTimeout(()=>n.remove(),1550);
  }
  function fallbackCopy(txt){
    const ta=document.createElement('textarea');
    ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); ta.remove();
    toast('已複製到剪貼簿！');
  }
